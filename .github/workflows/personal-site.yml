name: Personal site checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  site:
    if: github.repository == 'CoderChen01/coderchen01.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:prettier
      - run: bundle exec ruby test/scholarly_articles_test.rb
      - run: bundle exec ruby test/due_posts_test.rb
      - run: bundle exec ruby test/post_visibility_test.rb
      - run: bundle exec ruby test/blog_taxonomy_test.rb
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - run: bundle exec ruby bin/check_sitemap.rb
      - run: npx playwright install --with-deps chromium
      - run: npm run test:personal
